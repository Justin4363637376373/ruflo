name: 🐾 Pawdrix Daily CEO Report

on:
  schedule:
    - cron: '0 14 * * *'   # 9am EST (UTC-5) / 10am EDT (UTC-4) — runs year-round
  workflow_dispatch:         # Manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Dry run (no email sent, no Shopify changes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  daily-report:
    name: Run 7-Agent CEO System
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/pawdrix/package.json

      - name: Install dependencies
        working-directory: scripts/pawdrix
        run: npm install

      - name: Run Pawdrix CEO System
        working-directory: scripts/pawdrix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          REPORT_EMAIL: jh6979733@gmail.com
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node orchestrator.mjs --dry-run
          else
            node orchestrator.mjs
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawdrix-report-${{ github.run_id }}
          path: scripts/pawdrix/*.log
          if-no-files-found: ignore
          retention-days: 7
